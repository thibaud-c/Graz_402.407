<!doctype html>
<!-- lang tells assistive technology the language of the page. -->
<html lang="en">
<head>
  <!-- UTF-8 supports accents. The viewport lets the layout adapt to phone screens. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earthquake feed and local demo</title>
  <!-- Load Leaflet's own appearance and API from a fixed version on a CDN. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <!-- Relative paths load our files beside this HTML file. Custom CSS follows Leaflet CSS. -->
  <link rel="stylesheet" href="style.css">
  <!-- defer waits for HTML parsing; deferred classic scripts run in document order. -->
  <script src="app.js" defer></script>
</head>
<body>
  <header><h1>Earthquake feed and local demo</h1></header>
  <!-- Semantic elements describe content, while classes/IDs connect it to CSS and JS. -->
  <main>
    <p>Source: <a href="https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php">USGS earthquake feed</a>. Live results change; the local demo contains invented events.</p>
    <!-- Option values are read by JavaScript; visible labels explain the choice. -->
    <label for="source">Data source</label>
    <select id="source"><option value="live">Live USGS past-day feed</option><option value="demo">Local fictional demo</option></select>
    <button id="refresh" type="button">Load or refresh data</button>
    <label><input id="automatic" type="checkbox"> Refresh every 60 seconds after each request</label>
    <!-- role="status" announces changing feedback without moving keyboard focus. -->
    <p id="status" role="status">Choose a source and load data.</p>
    <!-- Leaflet fills this container. Its height comes from #map in style.css. -->
    <div id="map" aria-label="Interactive map"></div>
  </main>
  <footer><p>Teaching example for Graz 402.407. Adapt the question and content for your project.</p></footer>
</body>
</html>
